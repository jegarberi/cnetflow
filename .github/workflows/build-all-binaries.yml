name: Build All Binaries (Static & Dynamic)

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-all:
    name: Compile all binary variations
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config python3-pip python3-venv
          pip install conan
          conan profile detect --force

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Link Zig for scripts
        run: |
          # The scripts expect zig-cc and zig-cxx in the scripts directory
          ln -sf $(which zig) scripts/zig
          # Ensure zig wrappers are executable
          chmod +x scripts/zig-cc scripts/zig-cxx

      - name: Build Musl Release Binaries
        run: ./scripts/build_release_binaries.sh

      - name: Build CentOS 6 Binaries
        run: ./scripts/build_centos6_binaries.sh

      - name: Upload Binaries (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cnetflow-all-binaries
          path: bin/
          if-no-files-found: warn

      - name: Upload Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
