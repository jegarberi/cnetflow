apiVersion: 1
deleteDatasources:
  - name: 'db'
    orgId: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    orgId: 1
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: netflow
      username: '${CH_USER}'
    secureJsonData:
      password: '${CH_PASSWORD}'
